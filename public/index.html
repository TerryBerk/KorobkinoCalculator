<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Korobkino Calculator Demo</title>
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" sizes="16x16" href="/icons/icon-16.png" />
    <link rel="icon" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="mask-icon" href="/icons/favicon.svg" color="#ff7a00" />
    <link rel="stylesheet" href="./style.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 20% 20%, rgba(255, 122, 0, 0.12), transparent 45%),
          radial-gradient(circle at 80% 0%, rgba(93, 228, 199, 0.14), transparent 40%),
          linear-gradient(160deg, #03070d 0%, #0b1422 60%, #050b13 100%);
        color: #eef5ff;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 48px 16px 64px;
      }
    </style>
  </head>
  <body>
    <div id="demo-root" style="width: min(1100px, 100%);"></div>

    <script src="./korobkino-calculator.umd.js"></script>
    <script>
      const root = document.getElementById("demo-root");
      const urls = {
        servicesCsvUrl: "https://docs.google.com/spreadsheets/d/e/your-id/pub?gid=0&single=true&output=csv",
        logisticsCsvUrl: "https://docs.google.com/spreadsheets/d/e/your-id/pub?gid=1&single=true&output=csv",
        paramsCsvUrl: "https://docs.google.com/spreadsheets/d/e/your-id/pub?gid=2&single=true&output=csv"
      };
      if (root && window.KorobkinoCalculator) {
        window.KorobkinoCalculator.mount(root, { urls });
      }
    </script>
  </body>
</html>
